<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfbfa">
<title>Job triage</title>
<!--
  JOB TRIAGE PORTAL  ·  paste-in daily view
  ------------------------------------------------------------------
  HOW IT WORKS
  1. Each morning, open your "Job triage" run in Claude.
  2. Copy the whole brief (the grouped ★ list + "Apply today").
  3. Paste it into the box here and hit "Show board".
  4. Roles render grouped by rating, each with a direct link and an
     "Add to Trello" button that opens a pre-filled new card.

  RESTYLING  ->  everything visual lives in the :root variables below.
  Change those and you change the whole look. Fonts, colours, spacing,
  radius, all in one place. The rest of the CSS references these tokens.

  TRELLO  ->  set your board/list target once in the TRELLO_CONFIG block
  in the <script> at the bottom (search "TRELLO_CONFIG"). Until you do,
  the button falls back to Trello's generic add-card page, still pre-filled.
-->
<link rel="stylesheet" href="styles.css">
<div id="app">
  <button id="rawToggle" class="iconbtn corner-btn corner-pos" title="View the brief’s raw text" aria-label="View the brief’s raw text">Raw text</button>
  <div id="menuWrap" class="menu-wrap corner-pos" hidden>
    <button id="pipeMenuBtn" class="iconbtn corner-btn" aria-haspopup="true" aria-expanded="false" title="Board menu">☰</button>
    <div id="pipeMenu" class="menu" hidden>
      <button class="menu-item" id="menuAddList">+ Add list</button>
      <button class="menu-item" id="menuEditCols">Edit lists</button>
      <button class="menu-item" id="menuImport">Import from Trello…</button>
      <button class="menu-item" id="menuDeleted">Deleted <span class="menu-count" id="deletedCount">0</span></button>
    </div>
  </div>

  <header class="masthead">
    <h1>Job triage</h1>
    <div class="eyebrow" id="briefDate">Daily brief</div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-view="brief" role="tab">Brief</button>
    <button class="tab" data-view="pipeline" role="tab">Pipeline</button>
    <div id="pipeSearchWrap" class="pipe-searchwrap" hidden>
      <input id="pipeSearch" class="pipe-search" placeholder="Search company…" autocomplete="off" spellcheck="false" />
      <div id="pipeSearchResults" class="pipe-results" hidden></div>
    </div>
  </nav>

  <!-- ===== BRIEF VIEW ===== -->
  <div id="view-brief">
    <div id="freshBanner" class="freshbanner" hidden>
      <span>A newer brief has been published.</span>
      <button id="freshRefresh" class="linkbtn">Refresh</button>
    </div>

    <section id="board" class="board" hidden></section>

    <section id="applyToday" class="apply" hidden>
      <div class="eyebrow">Apply today</div>
      <div id="applyBody" class="applybody"></div>
    </section>

    <p id="emptyState" class="empty" hidden>No brief yet today. It publishes on weekday mornings — check back soon, or open <strong>Raw text</strong> to paste one in.</p>
  </div>

  <!-- ===== PIPELINE VIEW (kanban) ===== -->
  <div id="view-pipeline" hidden>
    <input type="file" id="importFile" accept="application/json,.json" hidden />
    <div id="pipeline" class="pipeline"></div>
  </div>
</div>

<!-- Card detail lightbox -->
<div id="cardModal" class="modal" hidden>
  <div class="modal-backdrop" id="cardBackdrop"></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Card detail">
    <div class="modal-head">
      <input id="cardCompany" class="card-title-input" placeholder="Company" />
      <select id="cardMove" class="card-move-select" aria-label="List"></select>
      <button id="cardClose" class="iconbtn" aria-label="Close">✕</button>
    </div>

    <div class="tc-row">
      <div class="tc-title">
        <label class="field-label" for="cardTitle">Title</label>
        <input id="cardTitle" class="card-line-input" placeholder="Role / position" />
      </div>
      <div class="tc-salary">
        <label class="field-label" for="cardSalary">Salary</label>
        <input id="cardSalary" class="card-salary-input" />
      </div>
    </div>

    <label class="field-label" for="cardNotes">Notes</label>
    <textarea id="cardNotes" class="card-notes" placeholder="Details, links, next steps…" spellcheck="false"></textarea>

    <label class="field-label">Add a status update</label>
    <div class="card-update-row">
      <input id="cardUpdateInput" class="card-update-input" placeholder="e.g. Sent application; recruiter call booked…" />
      <button id="cardUpdateAdd" class="btn primary">Add</button>
    </div>

    <label class="field-label">Activity</label>
    <div id="cardActivity" class="card-activity"></div>

    <div class="card-foot">
      <button id="cardDelete" class="linkbtn danger">Delete card</button>
    </div>
  </div>
</div>

<!-- Raw-text lightbox: hidden until the "Raw text" button is pressed. Shows the
     brief exactly as published, and doubles as the manual paste fallback. -->
<div id="rawModal" class="modal" hidden>
  <div class="modal-backdrop" id="rawBackdrop"></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Brief raw text">
    <div class="modal-head">
      <span class="eyebrow">Brief · raw text</span>
      <button id="rawClose" class="iconbtn" aria-label="Close">✕</button>
    </div>
    <textarea id="paste" placeholder="Paste a brief here to preview it…" spellcheck="false"></textarea>
    <div class="controls">
      <button id="render" class="btn primary">Show board</button>
      <button id="clear" class="btn ghost">Clear</button>
      <span id="status" class="status"></span>
    </div>
  </div>
</div>

<style>
  /* ================================================================
     DESIGN TOKENS  —  restyle here. Neutral on purpose.
     ================================================================ */
  :root {
    /* palette */
    --bg:          #fbfbfa;
    --surface:     #ffffff;
    --ink:         #1a1a18;
    --ink-soft:    #565650;
    --ink-faint:   #8a8a82;
    --line:        #e7e6e1;
    --accent:      #2c2c28;   /* buttons, links — swap for your brand */
    --accent-ink:  #ffffff;
    --star:        #d8a200;   /* the rating stars */
    --trello:      #0079bf;   /* leave or match your board */

    /* rating band tints (backgrounds of each group header) */
    --band-5: #f3f6f1;
    --band-4: #f5f4ef;
    --band-3: #f7f6f4;
    --band-2: #f8f8f7;

    /* type */
    --font-display: ui-serif, Georgia, "Times New Roman", serif;
    --font-body:    ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono:    ui-monospace, "SF Mono", Menlo, monospace;

    /* shape + space */
    --radius: 10px;
    --gap: 20px;
    --maxw: 760px;
  }

  * { box-sizing: border-box; }
  /* The [hidden] attribute must always win, even over display:flex elements
     like .modal and .freshbanner. */
  [hidden] { display: none !important; }

  #app {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 26px 24px 96px;
    position: relative;
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  /* ---- masthead (centered, compact) ---- */
  .masthead { margin-bottom: 10px; text-align: center; }
  .masthead .eyebrow { margin: 5px 0 0; }
  /* Top-right corner control — "Raw text" (Brief) and "☰" (Pipeline) share it. */
  .corner-pos { position: absolute; top: 24px; right: 24px; z-index: 20; }
  .corner-btn { height: 34px; min-width: 90px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; }
  #pipeMenuBtn { font-size: 15px; }
  .masthead-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  .iconbtn {
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .iconbtn:hover { color: var(--ink); border-color: var(--ink-faint); }

  /* ---- freshness banner ---- */
  .freshbanner {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    margin-bottom: 24px;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--band-5);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .linkbtn {
    font: inherit;
    font-weight: 600;
    color: var(--accent);
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
  }

  /* ---- raw-text lightbox ---- */
  .modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal-backdrop { position: absolute; inset: 0; background: rgba(20,20,18,0.44); }
  .modal-panel {
    position: relative;
    width: 100%;
    max-width: 640px;
    max-height: 85vh;
    overflow: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 24px 60px rgba(20,20,18,0.22);
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .modal-head .eyebrow { margin-bottom: 0; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .masthead h1 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .masthead .sub {
    margin: 0;
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 48ch;
  }

  /* ---- input ---- */
  .inputwrap { margin-bottom: 40px; }
  #paste {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    padding: 16px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.15s;
  }
  #paste:focus { border-color: var(--accent); }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
  }
  .btn {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    cursor: pointer;
    transition: opacity 0.15s, background 0.15s;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { opacity: 0.88; }
  .btn.ghost { background: transparent; color: var(--ink-soft); border-color: var(--line); }
  .btn.ghost:hover { color: var(--ink); }
  .status { font-size: 13px; color: var(--ink-faint); }

  /* ---- board ---- */
  .board { display: flex; flex-direction: column; gap: 28px; }

  .group { }
  .grouphead {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 14px;
    border-radius: var(--radius);
    margin-bottom: 12px;
  }
  .group[data-score="5"] .grouphead { background: var(--band-5); }
  .group[data-score="4"] .grouphead { background: var(--band-4); }
  .group[data-score="3"] .grouphead { background: var(--band-3); }
  .group[data-score="2"] .grouphead { background: var(--band-2); }

  .stars { color: var(--star); font-size: 15px; letter-spacing: 2px; }
  .grouplabel { font-weight: 600; font-size: 14px; }
  .groupcount { font-size: 12px; color: var(--ink-faint); font-family: var(--font-mono); }

  .role {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 14px 14px 14px 2px;
    border-bottom: 1px solid var(--line);
  }
  .role:last-child { border-bottom: none; }

  .rolemain { flex: 1; min-width: 0; }
  .roletitle {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    margin: 0 0 3px;
  }
  .roletitle a { color: var(--ink); text-decoration: none; border-bottom: 1.5px solid var(--accent); padding-bottom: 1px; }
  .roletitle a:hover { color: var(--accent); }
  .rolemeta { font-size: 12.5px; color: var(--ink-faint); font-family: var(--font-mono); margin-bottom: 5px; }
  .rolesource { font-weight: 600; }
  .rolereason { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; margin: 0; }
  .flag { display: inline-block; font-size: 10px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: middle; }

  .roleactions { flex-shrink: 0; }
  .trello-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--trello);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 11px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }
  .trello-btn:hover { background: color-mix(in srgb, var(--trello) 8%, transparent); border-color: var(--trello); }
  .trello-btn.added { color: var(--ink-faint); border-color: var(--line); }
  .trello-dot { width: 7px; height: 7px; border-radius: 2px; background: var(--trello); }

  /* Brief → Pipeline handoff button */
  .pipeline-btn {
    font-family: var(--font-body); font-size: 12.5px; font-weight: 500;
    color: var(--accent); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px;
    cursor: pointer; white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, transform 0.1s, color 0.15s;
  }
  .pipeline-btn:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); border-color: var(--accent); }
  .pipeline-btn:active { transform: scale(0.95); }
  .pipeline-btn.added { color: var(--ink-faint); border-color: var(--line); background: transparent; cursor: default; }

  @keyframes tabpulse { 0% { transform: scale(1); } 35% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .tab.pulse { animation: tabpulse 0.55s ease; color: var(--accent); }

  /* ---- apply today ---- */
  .apply {
    margin-top: 40px;
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .applybody { font-size: 14px; line-height: 1.6; color: var(--ink); }
  .applybody strong { font-weight: 600; }

  .empty { color: var(--ink-faint); font-size: 14px; padding: 20px 0; }

  /* ---- tabs ---- */
  .tabs {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 4px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .tab {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-faint);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 8px 14px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab:hover { color: var(--ink); }
  .tab.is-active { color: var(--ink); border-bottom-color: var(--accent); }

  /* ---- pipeline (kanban) ---- */
  .pipeline-toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    margin-bottom: 16px;
  }
  .pipeline-toolbar .eyebrow { margin-bottom: 0; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 12px 30px rgba(20,20,18,0.14);
    padding: 6px; min-width: 170px; z-index: 30;
    display: flex; flex-direction: column; gap: 2px;
  }
  .menu-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-family: var(--font-body); font-size: 14px; color: var(--ink);
    background: transparent; border: none; border-radius: 6px;
    padding: 9px 10px; cursor: pointer; text-align: left;
  }
  .menu-item:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .menu-item.is-on { color: var(--accent); font-weight: 600; }
  .menu-count { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
  .column.is-deleted { background: color-mix(in srgb, var(--ink) 5%, var(--surface)); border-style: dashed; }
  /* Pipeline breaks out of the centered 760px column to span the full
     viewport, so all lists are visible at once. (Full-bleed technique.) */
  #view-pipeline {
    width: 100vw;
    margin-left: calc(50% - 50vw);
    padding: 0 24px;
  }
  /* ---- company search (sits at the right of the tab row) ---- */
  .pipe-searchwrap { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 208px; }
  .pipe-search {
    width: 100%; height: 32px; padding: 0 11px;
    font-family: var(--font-body); font-size: 13px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  .pipe-search:focus { border-color: var(--accent); }
  .pipe-results {
    position: absolute; top: calc(100% + 4px); left: 0; width: 100%;
    max-height: 320px; overflow-y: auto; z-index: 25;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 12px 30px rgba(20,20,18,0.16);
  }
  .pipe-result { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 9px 12px; cursor: pointer; }
  .pipe-result:hover, .pipe-result.active { background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .pipe-result-name { flex: 1; min-width: 0; font-size: 13.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pipe-result-name strong { font-weight: 600; }
  .pipe-result-title { color: var(--ink-faint); }
  .pipe-result-list { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); white-space: nowrap; flex-shrink: 0; }
  .pipe-empty { padding: 10px 12px; font-size: 13px; color: var(--ink-faint); }

  .pipeline {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 12px;
    align-items: stretch;   /* columns fill the pipeline's height */
  }
  /* In the pipeline view, trim the app's tall bottom padding so full-height
     columns don't push the page into a vertical scroll. */
  body.pipeline-full #app { padding-bottom: 24px; }
  .column {
    flex: 1 1 220px;      /* share the width; grow to fill, shrink to min */
    min-width: 208px;
    max-width: 360px;
    min-height: 0;        /* allow the inner cards area to scroll */
    background: color-mix(in srgb, var(--ink) 3%, var(--surface));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .column-head { display: flex; align-items: center; gap: 8px; }
  .column-name {
    flex: 1;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 4px 6px;
    min-width: 0;
  }
  .column-name:focus { outline: none; border-color: var(--line); background: var(--surface); }
  .column-count { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
  .column-del {
    font-size: 15px; line-height: 1; color: var(--ink-faint);
    background: transparent; border: none; cursor: pointer; padding: 2px 4px;
  }
  .column-del:hover { color: var(--ink); }
  .col-edit { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .column-move {
    font-family: var(--font-mono); font-size: 13px; line-height: 1; color: var(--ink-soft);
    background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; cursor: pointer;
  }
  .column-move:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-faint); }
  .column-move:disabled { opacity: 0.35; cursor: default; }

  .cards { display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 11px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .card:hover { border-color: var(--ink-faint); box-shadow: 0 2px 8px rgba(20,20,18,0.06); }
  .card-topline { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card-topline .card-title { flex: 1; min-width: 0; }
  .card-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; color: var(--ink); overflow-wrap: anywhere; }
  .card-sub { font-size: 12px; color: var(--ink-faint); margin-top: 3px; line-height: 1.4; overflow-wrap: anywhere; }
  .cardface-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 9px; }
  .card-date { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint); }
  .card-salary { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); white-space: nowrap; flex-shrink: 0; }
  .card-nav { display: flex; gap: 6px; }
  .card-nav button {
    font-family: var(--font-mono); font-size: 13px; line-height: 1;
    color: var(--ink-soft); background: transparent; border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 8px; cursor: pointer;
  }
  .card-nav button:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-faint); }
  .card-nav button:disabled { opacity: 0.35; cursor: default; }

  .card-add {
    font-family: var(--font-body); font-size: 13px; color: var(--ink-soft);

  /* Uniform height for every single-line field/button in the card lightbox,

      min-height: 168px;

      font-size: 16px;   /* 16px keeps iOS from zooming in on focus */

    /* ---- header + lightbox on small screens ---- */

    /* ---- pipeline: one column fills the screen, swipe sideways ---- */
    .column { flex-basis: 82vw; max-width: 82vw; }
    .tabs { flex-wrap: wrap; }
    .pipe-searchwrap { position: static; transform: none; width: 100%; max-width: none; margin-top: 10px; }

    .tab { font-size: 15px; padding: 9px 16px; }

<script>
(function () {
  // ================================================================
  // TRELLO_CONFIG  —  set these two once and every card lands in the
  // right list automatically. Find the list ID by opening your board,
  // appending .json to the URL, and searching for your list's "id".
  // Leave blank to use Trello's generic pre-filled add-card page.
  // ================================================================
  var TRELLO_CONFIG = {
    idList: "",              // e.g. "5f2a...c3"  (target list id)
    defaultName: "Applications"
  };

  var pasteEl   = document.getElementById("paste");
  var boardEl   = document.getElementById("board");
  var applyEl   = document.getElementById("applyToday");
  var applyBody = document.getElementById("applyBody");
  var statusEl  = document.getElementById("status");
  var emptyEl   = document.getElementById("emptyState");
  var dateEl    = document.getElementById("briefDate");

  var GROUPS = [
    { score: 5, label: "Strong match" },
    { score: 4, label: "Worth a look" },
    { score: 3, label: "Maybe" },
    { score: 2, label: "Probably not" }
  ];

  function starStr(n) { return "★★★★★☆☆☆☆☆".slice(5 - n, 10 - n); }

  // Split a "Company — Role" brief line into { company, title } (same rule as the importer).
  function splitCompanyTitle(s) {
    var m = (s || "").match(/^([\s\S]*?)\s*[-—]\s+([\s\S]*)$/);
    return m ? { company: m[1].trim(), title: m[2].trim() } : { company: (s || "").trim(), title: "" };
  }

  // The job source (from the URL), with its brand colour.
  function sourceFromUrl(url) {
    if (!url) return null;
    var u = url.toLowerCase();
    if (u.indexOf("linkedin.") > -1) return { label: "LI", full: "LinkedIn", color: "#0A66C2" };
    if (u.indexOf("xing.") > -1) return { label: "XI", full: "XING", color: "#0E8074" };
    var m = url.match(/^https?:\/\/([^\/]+)/i);
    if (!m) return null;
    var host = m[1].replace(/^www\./i, "");
    var parts = host.split(".");
    var name = parts.length >= 2 ? parts[parts.length - 2] : parts[0];
    return { label: name.slice(0, 2).toUpperCase(), full: name.charAt(0).toUpperCase() + name.slice(1), color: null };
  }

  // ---- decide which score-group a header line starts ----
  function scoreFromHeader(line) {
    var stars = (line.match(/★/g) || []).length;
    if (stars >= 2 && stars <= 5) return stars;
    var low = line.toLowerCase();
    if (low.indexOf("strong match") > -1) return 5;
    if (low.indexOf("worth a look") > -1) return 4;
    if (low.indexOf("maybe") > -1) return 3;
    if (low.indexOf("probably not") > -1) return 2;
    return null;
  }

  function isUrl(line) { return /^https?:\/\/\S+$/i.test(line.trim()); }

  // A header line is short and contains stars or a group label.
  function isHeader(line) {
    return scoreFromHeader(line) !== null && line.length < 60 && !isUrl(line);
  }

  // ================================================================
  // PARSER — reads the fixed three-line role format:
  //     Company — Role Title            [manager]
  //     Level · Location · reason
  //     https://raw-direct-url
  // Blank line between roles. Falls back gracefully if a role is
  // missing its url or meta line.
  // ================================================================
  function parse(text) {
    var lines = text.split(/\r?\n/);
    var groups = {};
    var current = null;
    var applyLines = [];
    var inApply = false;

    // buffer of non-empty content lines for the current role
    var buf = [];

    function flushRole() {
      if (!buf.length || current === null) { buf = []; return; }
      var titleLine = buf[0];
      var url = null, meta = "", reason = "";

      // find a raw url among the buffered lines
      for (var k = 0; k < buf.length; k++) {
        if (isUrl(buf[k])) { url = buf[k].trim(); break; }
      }
      // the meta/reason line = first non-title, non-url line
      for (var j = 1; j < buf.length; j++) {
        if (!isUrl(buf[j])) { meta = buf[j]; break; }
      }

      // split title "Company — Role"
      var manager = /\[manager\]/i.test(titleLine);
      titleLine = titleLine.replace(/\[manager\]/ig, "").trim();

      // split meta "Level · Location · reason"  -> meta = first 1-2 parts, reason = rest
      if (meta) {
        var parts = meta.split(/\s+·\s+/);
        if (parts.length >= 3) {
          reason = parts.slice(2).join(" · ").trim();
          meta = parts.slice(0, 2).join(" · ").trim();
        } else if (parts.length === 2) {
          meta = parts[0].trim();
          reason = parts[1].trim();
        }
        // if it split on periods instead, salvage a reason
        if (!reason) {
          var dot = meta.indexOf(". ");
          if (dot > -1) { reason = meta.slice(dot + 1).trim(); meta = meta.slice(0, dot).trim(); }
        }
      }

      groups[current].push({
        title: titleLine,
        url: url,
        meta: meta,
        reason: reason,
        manager: manager
      });
      buf = [];
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();

      // blank line = role boundary
      if (!line) { flushRole(); continue; }

      // apply-today section
      if (/^\**apply today\**\s*:?/i.test(line)) {
        flushRole();
        inApply = true;
        applyLines.push(line.replace(/^\**apply today\**\s*:?/i, "").trim());
        continue;
      }
      if (inApply) { applyLines.push(line); continue; }

      // group header
      if (isHeader(line)) {
        flushRole();
        var s = scoreFromHeader(line);
        current = s;
        if (!groups[s]) groups[s] = [];
        continue;
      }

      // otherwise a content line for the current role; strip list markers
      var body = line.replace(/^[-*•\s]+/, "").trim();
      if (body) buf.push(body);
    }
    flushRole();

    return { groups: groups, apply: applyLines.join(" ").trim() };
  }

  function trelloHref(role) {
    var name = encodeURIComponent(role.title);
    var desc = encodeURIComponent((role.meta ? role.meta + "\n" : "") + (role.url || ""));
    if (TRELLO_CONFIG.idList) {
      return "https://trello.com/add-card?idList=" + encodeURIComponent(TRELLO_CONFIG.idList) +
             "&name=" + name + "&desc=" + desc + "&source=portal";
    }
    // generic fallback — pre-fills name+desc, user picks the list
    return "https://trello.com/add-card?name=" + name + "&desc=" + desc + "&source=portal";
  }

  function render(parsed) {
    boardEl.innerHTML = "";
    var any = false;

    GROUPS.forEach(function (g) {
      var roles = parsed.groups[g.score];
      if (!roles || !roles.length) return;
      any = true;

      var section = document.createElement("div");
      section.className = "group";
      section.setAttribute("data-score", g.score);

      var head = document.createElement("div");
      head.className = "grouphead";
      head.innerHTML =
        '<span class="stars">' + starStr(g.score) + '</span>' +
        '<span class="grouplabel">' + g.label + '</span>' +
        '<span class="groupcount">' + roles.length + '</span>';
      section.appendChild(head);

      roles.forEach(function (role) {
        var row = document.createElement("div");
        row.className = "role";

        var main = document.createElement("div");
        main.className = "rolemain";

        var title = document.createElement("p");
        title.className = "roletitle";
        if (role.url) {
          title.innerHTML = '<a href="' + role.url + '" target="_blank" rel="noopener">' + role.title + '</a>';
        } else {
          title.textContent = role.title;
        }
        if (role.manager) {
          var flag = document.createElement("span");
          flag.className = "flag";
          flag.textContent = "manager";
          title.appendChild(flag);
        }
        main.appendChild(title);

        var level = role.meta ? role.meta.split(/\s+·\s+/)[0].trim() : "";   // drop location
        var src = sourceFromUrl(role.url);
        if (level || src) {
          var meta = document.createElement("div");
          meta.className = "rolemeta";
          if (level) meta.appendChild(document.createTextNode(level));
          if (src) {
            if (level) meta.appendChild(document.createTextNode(" · "));
            var ss = document.createElement("span");
            ss.className = "rolesource";
            ss.textContent = src.label;
            if (src.full) ss.title = src.full;
            if (src.color) ss.style.color = src.color;
            meta.appendChild(ss);
          }
          main.appendChild(meta);
        }
        if (role.reason) {
          var reason = document.createElement("p");
          reason.className = "rolereason";
          reason.textContent = role.reason;
          main.appendChild(reason);
        }

        var actions = document.createElement("div");
        actions.className = "roleactions";
        var split = splitCompanyTitle(role.title);
        var t = document.createElement("button");
        t.className = "pipeline-btn";
        if (window.PipelineAPI && window.PipelineAPI.hasRole(split.company, split.title)) {
          t.classList.add("added"); t.textContent = "In pipeline ✓";   // already there — stays disabled across refreshes
        } else {
          t.textContent = "Add to Pipeline";
        }
        t.addEventListener("click", function () {
          if (t.classList.contains("added")) return;
          var res = window.PipelineAPI && window.PipelineAPI.addRole(split.company, split.title);
          if (res === "added") { t.classList.add("added"); t.textContent = "Added ✓"; }
          else if (res === "exists") { t.classList.add("added"); t.textContent = "In pipeline ✓"; }
        });
        actions.appendChild(t);

        row.appendChild(main);
        row.appendChild(actions);
        section.appendChild(row);
      });

      boardEl.appendChild(section);
    });

    if (emptyEl) emptyEl.hidden = any;   // hide the empty-state note once we have roles

    boardEl.hidden = !any;
    if (!any) {
      boardEl.hidden = false;
      boardEl.innerHTML = '<p class="empty">No roles found. Open “Raw text” to check the brief, or the format changed and the parser needs a tweak.</p>';
    }

    if (parsed.apply) {
      applyBody.innerHTML = parsed.apply.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      applyEl.hidden = false;
    } else {
      applyEl.hidden = true;
    }
  }

  document.getElementById("render").addEventListener("click", function () {
    var text = pasteEl.value.trim();
    if (!text) { statusEl.textContent = "Paste the brief first."; return; }
    render(parse(text));
    closeModal();
  });

  document.getElementById("clear").addEventListener("click", function () {
    pasteEl.value = "";
    boardEl.hidden = true;
    applyEl.hidden = true;
    statusEl.textContent = "";
    pasteEl.focus();
  });

  // ================================================================
  // TODAY'S DATE in the masthead eyebrow. Uses the brief's publish
  // time when we have one (set in autoLoad); defaults to today.
  // ================================================================
  function setDateLabel(d) {
    try {
      dateEl.textContent = (d || new Date()).toLocaleDateString(undefined, {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });
    } catch (e) { /* leave default */ }
  }
  setDateLabel();

  // ================================================================
  // RAW-TEXT LIGHTBOX — open/close the modal that shows the brief's
  // source (and lets you paste one manually).
  // ================================================================
  var modalEl = document.getElementById("rawModal");
  function openModal()  { modalEl.hidden = false; pasteEl.focus(); }
  function closeModal() { modalEl.hidden = true; }
  document.getElementById("rawToggle").addEventListener("click", openModal);
  document.getElementById("rawClose").addEventListener("click", closeModal);
  document.getElementById("rawBackdrop").addEventListener("click", closeModal);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !modalEl.hidden) closeModal();
  });

  // ================================================================
  // AUTO-LOAD — if a published brief.enc exists, fetch and decrypt it
  // in-browser so the board is ready without pasting. brief.enc is
  // ciphertext (AES-256-GCM); the passphrase never leaves this device.
  // Matches scripts/encrypt-brief.mjs. Falls back to the paste box on
  // any problem (nothing published, offline, wrong passphrase).
  // ================================================================
  var PUBLISHED_URL = "brief.enc";
  var PASS_KEY = "triage_pass";

  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function deriveKey(pass, salt, iter) {
    return crypto.subtle
      .importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      });
  }

  function decryptBrief(payload, pass) {
    return deriveKey(pass, b64ToBytes(payload.salt), payload.iter || 250000)
      .then(function (key) {
        return crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64ToBytes(payload.iv) }, key, b64ToBytes(payload.ct));
      })
      .then(function (pt) { return new TextDecoder().decode(pt); });
  }

  var loadedCt = null;   // ciphertext of the brief currently shown (freshness marker)

  // Load the published brief. `isPoll` = a background check (never prompts,
  // never fires notifications for the first paint).
  function autoLoad(isPoll) {
    return fetch(PUBLISHED_URL + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) return null;
        var when = res.headers.get("last-modified");
        return res.json().then(function (p) { return { p: p, when: when }; });
      })
      .then(function (data) {
        if (!data || !data.p || !data.p.ct) {          // nothing published yet
          if (!isPoll && emptyEl) emptyEl.hidden = false;
          return;
        }
        var payload = data.p;

        // Background poll: if the ciphertext changed, a newer brief exists.
        if (isPoll) {
          if (loadedCt && payload.ct !== loadedCt) notifyNewBrief();
          return;
        }

        var pass = localStorage.getItem(PASS_KEY);
        if (!pass) {
          pass = window.prompt("Passphrase to unlock today's brief:");
          if (!pass) { if (emptyEl) emptyEl.hidden = false; return; }
        }
        return decryptBrief(payload, pass).then(function (text) {
          localStorage.setItem(PASS_KEY, pass);   // remember once it works
          loadedCt = payload.ct;
          if (freshBanner) freshBanner.hidden = true;
          pasteEl.value = text;
          render(parse(text));
          if (data.when) setDateLabel(new Date(data.when));
        }).catch(function () {
          localStorage.removeItem(PASS_KEY);       // wrong passphrase — forget it
          if (emptyEl) emptyEl.hidden = false;
          statusEl.textContent = "Couldn't unlock (wrong passphrase?). Reload to retry, or paste below.";
        });
      })
      .catch(function () { /* offline or not served — nothing to show */ });
  }

  // ================================================================
  // FRESHNESS — poll every few minutes for a newer brief. When one
  // appears, show the banner and (if allowed) a desktop notification.
  // ================================================================
  var freshBanner = document.getElementById("freshBanner");

  function notifyNewBrief() {
    if (freshBanner) freshBanner.hidden = false;
    try {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("Job triage", { body: "A newer brief has been published." });
      }
    } catch (e) { /* ignore */ }
  }

  if (freshBanner) {
    document.getElementById("freshRefresh").addEventListener("click", function () {
      freshBanner.hidden = true;
      autoLoad(false);   // re-decrypt and re-render in place (no full reload)
    });
  }
  // Ask once for notification permission (best-effort; harmless if blocked).
  try {
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }
  } catch (e) { /* ignore */ }

  autoLoad(false);
  setInterval(function () { autoLoad(true); }, 5 * 60 * 1000);   // every 5 min
})();
</script>

<script>
// ================================================================
// PIPELINE — a local, Trello-like board (tabs, columns, cards,
// status updates, documented moves). All state persists via the
// STORAGE LAYER below; that is the ONLY place data is read/written,
// so migrating to a synced backend later means changing just those
// two functions.
// ================================================================
(function () {
  // ---- tabs ----
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  var viewBrief = document.getElementById("view-brief");
  var viewPipe  = document.getElementById("view-pipeline");
  var rawToggle = document.getElementById("rawToggle");

  function showView(name) {
    tabs.forEach(function (t) { t.classList.toggle("is-active", t.dataset.view === name); });
    viewBrief.hidden = name !== "brief";
    viewPipe.hidden  = name !== "pipeline";
    if (rawToggle) rawToggle.style.visibility = (name === "brief") ? "visible" : "hidden";
    var mw = document.getElementById("menuWrap"); if (mw) mw.hidden = (name !== "pipeline");
    var sw = document.getElementById("pipeSearchWrap");
    if (sw) {
      sw.hidden = (name !== "pipeline");
      if (name !== "pipeline") {
        var si = document.getElementById("pipeSearch"); if (si) si.value = "";
        var sr = document.getElementById("pipeSearchResults"); if (sr) sr.hidden = true;
      }
    }
    document.body.classList.toggle("pipeline-full", name === "pipeline");
    try { localStorage.setItem("triage_tab", name); } catch (e) {}
    if (name === "pipeline") { renderBoard(); sizePipeline(); requestAnimationFrame(sizePipeline); }
  }

  // Make the board fill from its top edge to the bottom of the viewport, so
  // each list is screen-tall and its cards scroll inside it (not the page).
  function sizePipeline() {
    if (viewPipe.hidden) return;
    var top = pipelineEl.getBoundingClientRect().top;
    var pb = parseFloat(getComputedStyle(document.getElementById("app")).paddingBottom) || 0;
    pipelineEl.style.height = Math.max(window.innerHeight - top - pb, 240) + "px";
  }
  window.addEventListener("resize", sizePipeline);
  tabs.forEach(function (t) { t.addEventListener("click", function () { showView(t.dataset.view); }); });

  // ---- STORAGE LAYER (swap these two to sync across devices later) ----
  var STORE_KEY = "triage_board_v1";
  function loadBoard() {
    try { var raw = localStorage.getItem(STORE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return null;
  }
  function saveBoard(b) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(b)); } catch (e) {}
  }

  // ---- model ----
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function now() { return Date.now(); }
  function defaultBoard() {
    var cols = ["Backlog", "Applied", "Interviewing", "Offer", "Closed"].map(function (n) {
      return { id: uid(), name: n };
    });
    return { columns: cols, cards: [] };
  }
  var board = loadBoard() || defaultBoard();

  // A hidden system "Deleted" bucket — cards are soft-deleted into it,
  // reachable from the board menu, restorable by moving them back out.
  var showDeleted = false;
  var editColumns = false;
  var deletedCol = board.columns.filter(function (c) { return c.system; })[0];
  if (!deletedCol) { deletedCol = { id: "__deleted__", name: "Deleted", system: true }; board.columns.push(deletedCol); }
  var DELETED_ID = deletedCol.id;
  saveBoard(board);

  function normalColumns() { return board.columns.filter(function (c) { return !c.system; }); }
  function colById(id)  { return board.columns.filter(function (c) { return c.id === id; })[0]; }
  function cardById(id) { return board.cards.filter(function (c) { return c.id === id; })[0]; }
  function cardsIn(colId) {
    return board.cards.filter(function (c) { return c.colId === colId; })
      .sort(function (a, b) { return lastUpdatedAt(b) - lastUpdatedAt(a); });   // newest action on top
  }
  function fmtWhen(ts) {
    try { return new Date(ts).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
    catch (e) { return ""; }
  }
  function fmtShortDate(ts) {
    var d = new Date(ts);
    if (isNaN(d.getTime())) return "";
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear();
  }
  function lastUpdatedAt(card) {
    return (card.activity && card.activity.length) ? card.activity[card.activity.length - 1].at : card.createdAt;
  }

  // ---- render board ----
  var pipelineEl = document.getElementById("pipeline");

  function renderBoard() {
    // remember scroll positions so re-rendering (e.g. after closing a card)
    // doesn't jump each list back to the top
    var prevScroll = {}, prevLeft = pipelineEl.scrollLeft;
    pipelineEl.querySelectorAll(".cards").forEach(function (el) {
      if (el.dataset.col) prevScroll[el.dataset.col] = el.scrollTop;
    });

    pipelineEl.innerHTML = "";
    var normals = normalColumns();
    normals.forEach(function (col, idx) { pipelineEl.appendChild(buildColumn(col, idx, normals.length, false)); });
    if (showDeleted) pipelineEl.appendChild(buildColumn(deletedCol, -1, normals.length, true));
    var dc = document.getElementById("deletedCount");
    if (dc) dc.textContent = cardsIn(DELETED_ID).length;

    pipelineEl.scrollLeft = prevLeft;
    pipelineEl.querySelectorAll(".cards").forEach(function (el) {
      if (el.dataset.col && prevScroll[el.dataset.col] != null) el.scrollTop = prevScroll[el.dataset.col];
    });
  }

  function buildColumn(col, idx, total, isDeleted) {
    var colEl = document.createElement("div");
    colEl.className = "column" + (isDeleted ? " is-deleted" : "");

    var head = document.createElement("div");
    head.className = "column-head";
    if (isDeleted) {
      var label = document.createElement("span");
      label.className = "column-name"; label.style.padding = "4px 6px"; label.textContent = col.name;
      head.appendChild(label);
    } else {
      var name = document.createElement("input");
      name.className = "column-name"; name.value = col.name;
      name.addEventListener("change", function () {
        col.name = name.value.trim() || "Untitled"; name.value = col.name; saveBoard(board);
      });
      head.appendChild(name);
    }
    if (!isDeleted && editColumns) {
      var ec = document.createElement("div");
      ec.className = "col-edit";
      var ml = document.createElement("button"); ml.className = "column-move"; ml.textContent = "‹"; ml.title = "Move list left"; ml.disabled = idx === 0;
      ml.addEventListener("click", function () { moveColumn(col.id, -1); });
      var mr = document.createElement("button"); mr.className = "column-move"; mr.textContent = "›"; mr.title = "Move list right"; mr.disabled = idx === total - 1;
      mr.addEventListener("click", function () { moveColumn(col.id, 1); });
      var del = document.createElement("button"); del.className = "column-del"; del.textContent = "×"; del.title = "Delete list";
      del.addEventListener("click", function () { deleteColumn(col.id); });
      ec.appendChild(ml); ec.appendChild(mr); ec.appendChild(del);
      head.appendChild(ec);
    } else {
      var count = document.createElement("span");
      count.className = "column-count"; count.textContent = cardsIn(col.id).length;
      head.appendChild(count);
    }
    colEl.appendChild(head);

    var cardsEl = document.createElement("div");
    cardsEl.className = "cards";
    cardsEl.dataset.col = col.id;
    cardsIn(col.id).forEach(function (card) { cardsEl.appendChild(renderCard(card, idx, total, isDeleted)); });
    colEl.appendChild(cardsEl);

    if (!isDeleted) {
      var add = document.createElement("button");
      add.className = "card-add"; add.textContent = "+ Add a card";
      add.addEventListener("click", function () { addCard(col.id); });
      colEl.appendChild(add);
    }
    return colEl;
  }

  function renderCard(card, colIdx, total, isDeleted) {
    var el = document.createElement("div");
    el.className = "card";
    var top = document.createElement("div");
    top.className = "card-topline";
    var t = document.createElement("div");
    t.className = "card-title"; t.textContent = card.company || card.title || "Untitled";
    top.appendChild(t);
    if (card.salary) {
      var sal = document.createElement("span");
      sal.className = "card-salary"; sal.textContent = card.salary;
      top.appendChild(sal);
    }
    el.appendChild(top);
    if (card.company && card.title) {
      var s = document.createElement("div");
      s.className = "card-sub";
      s.textContent = card.title;
      el.appendChild(s);
    }
    var foot = document.createElement("div");
    foot.className = "cardface-foot";
    var d = document.createElement("div");
    d.className = "card-date";
    d.textContent = fmtShortDate(lastUpdatedAt(card));
    foot.appendChild(d);
    if (!isDeleted) {
      var nav = document.createElement("div");
      nav.className = "card-nav";
      var left = document.createElement("button"); left.textContent = "‹"; left.title = "Move to previous list";
      left.disabled = colIdx === 0;
      left.addEventListener("click", function (e) { e.stopPropagation(); moveCardByOffset(card.id, -1); });
      var right = document.createElement("button"); right.textContent = "›"; right.title = "Move to next list";
      right.disabled = colIdx === total - 1;
      right.addEventListener("click", function (e) { e.stopPropagation(); moveCardByOffset(card.id, 1); });
      nav.appendChild(left); nav.appendChild(right);
      foot.appendChild(nav);
    }
    el.appendChild(foot);

    el.addEventListener("click", function () { openCard(card.id); });
    return el;
  }

  // ---- mutations ----
  function addColumn() { board.columns.push({ id: uid(), name: "New list" }); saveBoard(board); renderBoard(); }
  function moveColumn(colId, delta) {
    var normals = normalColumns();
    var idx = normals.map(function (c) { return c.id; }).indexOf(colId);
    var target = idx + delta;
    if (idx < 0 || target < 0 || target >= normals.length) return;
    var a = board.columns.indexOf(normals[idx]), b = board.columns.indexOf(normals[target]);
    var t = board.columns[a]; board.columns[a] = board.columns[b]; board.columns[b] = t;
    saveBoard(board); renderBoard();
  }
  function deleteColumn(colId) {
    var n = cardsIn(colId).length;
    if (n && !confirm("Delete this list and its " + n + " card(s)?")) return;
    board.columns = board.columns.filter(function (c) { return c.id !== colId; });
    board.cards   = board.cards.filter(function (c) { return c.colId !== colId; });
    saveBoard(board); renderBoard();
  }
  function addCard(colId) {
    var card = { id: uid(), colId: colId, company: "", salary: "", title: "", notes: "", createdAt: now(),
                 activity: [{ at: now(), type: "created" }] };
    board.cards.push(card); saveBoard(board); renderBoard();
    openCard(card.id);        // fill it in via the lightbox (like editing)
    elCompany.focus();
  }
  function moveCardToColumn(cardId, toColId) {
    var card = cardById(cardId); if (!card || card.colId === toColId) return;
    var from = colById(card.colId), to = colById(toColId);
    card.colId = toColId;
    card.activity.push({ at: now(), type: "move", from: from ? from.name : "?", to: to ? to.name : "?" });
    saveBoard(board);
  }
  function moveCardByOffset(cardId, delta) {
    var card = cardById(cardId); if (!card) return;
    var normals = normalColumns();
    var idx = normals.map(function (c) { return c.id; }).indexOf(card.colId);
    var target = idx + delta;
    if (idx < 0 || target < 0 || target >= normals.length) return;
    moveCardToColumn(cardId, normals[target].id);
    renderBoard();
  }

  // ---- card modal ----
  var cardModal   = document.getElementById("cardModal");
  var openCardId  = null;
  var elCompany   = document.getElementById("cardCompany");
  var elSalary    = document.getElementById("cardSalary");
  var elTitle     = document.getElementById("cardTitle");
  var elNotes     = document.getElementById("cardNotes");
  var elMove      = document.getElementById("cardMove");
  var elActivity  = document.getElementById("cardActivity");
  var elUpdateIn  = document.getElementById("cardUpdateInput");

  function openCard(id)  { openCardId = id; renderCardModal(); cardModal.hidden = false; }
  function closeCard() {
    var card = cardById(openCardId);
    // discard a card left completely empty (e.g. opened via "+ Add a card" then closed)
    if (card && !(card.company || "").trim() && !(card.salary || "").trim() && !(card.title || "").trim() && !(card.notes || "").trim()
        && card.activity.filter(function (a) { return a.type !== "created"; }).length === 0) {
      board.cards = board.cards.filter(function (c) { return c.id !== card.id; });
      saveBoard(board);
    }
    cardModal.hidden = true; openCardId = null; renderBoard();
  }

  function renderCardModal() {
    var card = cardById(openCardId); if (!card) return;
    elCompany.value = card.company || "";
    elSalary.value = card.salary || "";
    elTitle.value = card.title || "";
    elNotes.value = card.notes || "";
    elMove.innerHTML = "";
    normalColumns().forEach(function (col) {
      var o = document.createElement("option");
      o.value = col.id; o.textContent = col.name;
      if (col.id === card.colId) o.selected = true;
      elMove.appendChild(o);
    });
    // A deleted card shows "Deleted" as current; picking a real list restores it.
    if (card.colId === DELETED_ID) {
      var od = document.createElement("option");
      od.value = DELETED_ID; od.textContent = "Deleted"; od.selected = true;
      elMove.appendChild(od);
    }
    var delBtn = document.getElementById("cardDelete");
    if (delBtn) delBtn.textContent = (card.colId === DELETED_ID) ? "Delete forever" : "Delete card";
    elActivity.innerHTML = "";
    card.activity.slice().reverse().forEach(function (a) {
      var item = document.createElement("div");
      item.className = "activity-item" + (a.type === "move" ? " move" : "");
      var txt = a.type === "move" ? ("Moved " + a.from + " → " + a.to)
              : a.type === "created" ? "Card created"
              : a.text;
      var body = document.createElement("span"); body.textContent = txt;
      var when = document.createElement("span"); when.className = "when"; when.textContent = fmtWhen(a.at);
      item.appendChild(body); item.appendChild(when);
      elActivity.appendChild(item);
    });
  }

  elCompany.addEventListener("change", function () {
    var card = cardById(openCardId); if (!card) return;
    card.company = elCompany.value.trim(); saveBoard(board);
  });
  elSalary.addEventListener("change", function () {
    var card = cardById(openCardId); if (!card) return;
    card.salary = elSalary.value.trim(); saveBoard(board);
  });
  elTitle.addEventListener("change", function () {
    var card = cardById(openCardId); if (!card) return;
    card.title = elTitle.value.trim(); saveBoard(board);
  });
  elNotes.addEventListener("change", function () {
    var card = cardById(openCardId); if (!card) return;
    card.notes = elNotes.value; saveBoard(board);
  });
  elMove.addEventListener("change", function () { moveCardToColumn(openCardId, elMove.value); renderCardModal(); });

  function addUpdate() {
    var card = cardById(openCardId); if (!card) return;
    var txt = elUpdateIn.value.trim(); if (!txt) return;
    card.activity.push({ at: now(), type: "update", text: txt });
    elUpdateIn.value = ""; saveBoard(board); renderCardModal();
  }
  document.getElementById("cardUpdateAdd").addEventListener("click", addUpdate);
  elUpdateIn.addEventListener("keydown", function (e) { if (e.key === "Enter") addUpdate(); });

  document.getElementById("cardDelete").addEventListener("click", function () {
    var card = cardById(openCardId); if (!card) return;
    if (card.colId === DELETED_ID) {
      if (!confirm("Delete this card forever? This cannot be undone.")) return;
      board.cards = board.cards.filter(function (c) { return c.id !== card.id; });
      saveBoard(board); closeCard();
    } else {
      moveCardToColumn(card.id, DELETED_ID);   // soft-delete: goes to the Deleted bucket
      cardModal.hidden = true; openCardId = null; renderBoard();
    }
  });
  document.getElementById("cardClose").addEventListener("click", closeCard);
  document.getElementById("cardBackdrop").addEventListener("click", closeCard);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !cardModal.hidden) closeCard(); });

  // ---- board menu (hamburger): infrequent actions ----
  var pipeMenu    = document.getElementById("pipeMenu");
  var pipeMenuBtn = document.getElementById("pipeMenuBtn");
  function toggleMenu(show) {
    var willShow = (typeof show === "boolean") ? show : pipeMenu.hidden;
    pipeMenu.hidden = !willShow;
    pipeMenuBtn.setAttribute("aria-expanded", willShow ? "true" : "false");
  }
  pipeMenuBtn.addEventListener("click", function (e) { e.stopPropagation(); toggleMenu(); });
  document.addEventListener("click", function (e) {
    if (!pipeMenu.hidden && !pipeMenu.contains(e.target) && e.target !== pipeMenuBtn) toggleMenu(false);
  });
  document.getElementById("menuAddList").addEventListener("click", function () { toggleMenu(false); if (editColumns) { editColumns = false; document.getElementById("menuEditCols").classList.remove("is-on"); } addColumn(); });
  document.getElementById("menuEditCols").addEventListener("click", function () {
    editColumns = !editColumns;
    this.classList.toggle("is-on", editColumns);
    toggleMenu(false); renderBoard();
  });

  // ---- import from a Trello board JSON export ----
  function trelloToBoard(data) {
    function splitName(name) {
      var m = (name || "").match(/^([\s\S]*?)\s*[-—]\s+([\s\S]*)$/);
      return m ? { company: m[1].trim(), title: m[2].trim() } : { company: (name || "").trim(), title: "" };
    }
    function idToTime(id) { var s = parseInt(String(id).slice(0, 8), 16); return isFinite(s) ? s * 1000 : now(); }
    // "Any Fields" power-up values live in each card's pluginData (a JSON string);
    // field 15682 = role, 15683 = salary. (Long roles were truncated by the add-on.)
    function anyFields(c) {
      var out = {};
      (c.pluginData || []).forEach(function (p) {
        if (!/ANY_FIELDS/.test(p.value || "")) return;
        try { var v = JSON.parse(p.value); (v["PU_ANY_FIELDS-badges"] || []).forEach(function (b) { out[b.f] = b.v; }); } catch (e) {}
      });
      return out;
    }
    function fmtSalary(v) { v = String(v == null ? "" : v).trim(); return /^\d{1,3}$/.test(v) ? ("€" + v + "k") : v; }

    var openLists = (data.lists || []).filter(function (l) { return !l.closed; }).sort(function (a, b) { return a.pos - b.pos; });
    var colMap = {}, columns = openLists.map(function (l) { var id = uid(); colMap[l.id] = id; return { id: id, name: l.name }; });

    var actByCard = {};
    (data.actions || []).forEach(function (a) { var cid = a.data && a.data.card && a.data.card.id; if (cid) { (actByCard[cid] = actByCard[cid] || []).push(a); } });

    var cards = (data.cards || []).filter(function (c) { return !c.closed && colMap[c.idList]; })
      .sort(function (a, b) { return (a.pos || 0) - (b.pos || 0); })
      .map(function (c) {
        var sn = splitName(c.name);
        var af = anyFields(c);
        var role = af[15682] != null ? String(af[15682]).trim() : "";
        var title = sn.title || role;                                  // name role, else Any-Fields role
        var salary = af[15683] != null ? fmtSalary(af[15683]) : "";
        var notes = (c.desc || "").trim();
        var atts = c.attachments || [];
        if (atts.length) { notes += (notes ? "\n\n" : "") + atts.map(function (a) { return "📎 " + a.name; }).join("\n"); }
        var acts = (actByCard[c.id] || []).slice().sort(function (x, y) { return new Date(x.date) - new Date(y.date); });
        var activity = [], hasCreated = false;
        acts.forEach(function (a) {
          if (a.type === "createCard") { activity.push({ at: +new Date(a.date), type: "created" }); hasCreated = true; }
          else if (a.type === "updateCard" && a.data.listBefore && a.data.listAfter) { activity.push({ at: +new Date(a.date), type: "move", from: a.data.listBefore.name, to: a.data.listAfter.name }); }
          else if (a.type === "commentCard" && a.data.text) { activity.push({ at: +new Date(a.date), type: "update", text: a.data.text }); }
        });
        var createdAt = hasCreated ? activity.filter(function (x) { return x.type === "created"; })[0].at : idToTime(c.id);
        if (!hasCreated) { activity.unshift({ at: createdAt, type: "created" }); }
        activity.sort(function (x, y) { return x.at - y.at; });
        return { id: uid(), colId: colMap[c.idList], company: sn.company, salary: salary, title: title, notes: notes, createdAt: createdAt, activity: activity };
      });

    return { columns: columns, cards: cards };
  }

  document.getElementById("menuImport").addEventListener("click", function () { toggleMenu(false); document.getElementById("importFile").click(); });
  document.getElementById("importFile").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try { data = JSON.parse(reader.result); } catch (err) { alert("That file isn't valid JSON."); e.target.value = ""; return; }
      if (!data.lists || !data.cards) { alert("That doesn't look like a Trello board export (no lists/cards found)."); e.target.value = ""; return; }
      var conv = trelloToBoard(data);
      if (!confirm("Import " + conv.cards.length + " cards into " + conv.columns.length + " lists?\n\nThis REPLACES your current pipeline board.")) { e.target.value = ""; return; }
      board.columns = conv.columns.concat([deletedCol]);   // keep the system Deleted bucket
      board.cards = conv.cards;
      saveBoard(board); renderBoard();
      e.target.value = "";
      alert("Imported " + conv.cards.length + " cards.");
    };
    reader.readAsText(file);
  });

  document.getElementById("menuDeleted").addEventListener("click", function () {
    showDeleted = !showDeleted;
    this.classList.toggle("is-on", showDeleted);
    toggleMenu(false); renderBoard();
  });

  // ---- external API: let the Brief tab drop a role into the pipeline ----
  function appliedColumn() {
    var m = normalColumns().filter(function (c) { return (c.name || "").toLowerCase() === "applied"; })[0];
    return m || normalColumns()[0];
  }
  function roleKey(company, title) { return ((company || "").trim() + " | " + (title || "").trim()).toLowerCase(); }
  function roleExists(company, title) {
    var k = roleKey(company, title);
    return board.cards.some(function (c) { return c.colId !== DELETED_ID && roleKey(c.company, c.title) === k; });
  }
  window.PipelineAPI = {
    hasRole: function (company, title) { return roleExists(company, title); },
    addRole: function (company, title) {
      if (roleExists(company, title)) return "exists";          // never add the same position twice
      var col = appliedColumn();
      if (!col) return "error";
      board.cards.push({ id: uid(), colId: col.id, company: company || "", salary: "", title: title || "", notes: "", createdAt: now(), activity: [{ at: now(), type: "created" }] });
      saveBoard(board);
      if (!viewPipe.hidden) renderBoard();
      var pt = document.querySelector('.tab[data-view="pipeline"]');   // flash the Pipeline tab
      if (pt) { pt.classList.remove("pulse"); void pt.offsetWidth; pt.classList.add("pulse"); }
      return "added";
    }
  };

  // ---- company search (partial + typo-tolerant) ----
  var searchInput = document.getElementById("pipeSearch");
  var resultsEl   = document.getElementById("pipeSearchResults");

  function levenshtein(a, b) {
    var m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    var prev = []; for (var j = 0; j <= n; j++) prev[j] = j;
    for (var i = 1; i <= m; i++) {
      var cur = [i];
      for (var k = 1; k <= n; k++) {
        var cost = a.charAt(i - 1) === b.charAt(k - 1) ? 0 : 1;
        cur[k] = Math.min(prev[k] + 1, cur[k - 1] + 1, prev[k - 1] + cost);
      }
      prev = cur;
    }
    return prev[n];
  }

  function searchCards(query) {
    query = query.toLowerCase().trim();
    if (!query) return [];
    var out = [];
    board.cards.forEach(function (c) {
      var comp = (c.company || "").toLowerCase();
      if (!comp) return;
      var score = null, idx = comp.indexOf(query);
      if (idx > -1) { score = idx; }                                  // substring (earlier = better)
      else {
        var qi = 0;                                                   // subsequence
        for (var i = 0; i < comp.length && qi < query.length; i++) { if (comp.charAt(i) === query.charAt(qi)) qi++; }
        if (qi === query.length) { score = 100; }
        else {                                                        // typo tolerance
          var dist = levenshtein(query, comp);
          comp.split(/\s+/).forEach(function (w) { dist = Math.min(dist, levenshtein(query, w)); });
          var thr = query.length <= 4 ? 1 : 2;
          if (dist <= thr) { score = 200 + dist; }
        }
      }
      if (score != null) out.push({ card: c, score: score });
    });
    out.sort(function (a, b) { return a.score - b.score || (a.card.company || "").localeCompare(b.card.company || ""); });
    return out.slice(0, 15);
  }

  function renderSearch() {
    var q = searchInput.value.trim();
    if (!q) { resultsEl.hidden = true; resultsEl.innerHTML = ""; return; }
    var res = searchCards(q);
    resultsEl.innerHTML = "";
    if (!res.length) { resultsEl.innerHTML = '<div class="pipe-empty">No company matches</div>'; resultsEl.hidden = false; return; }
    res.forEach(function (r) {
      var c = r.card, listName = (colById(c.colId) || {}).name || "?";
      var row = document.createElement("div"); row.className = "pipe-result";
      var name = document.createElement("div"); name.className = "pipe-result-name";
      var b = document.createElement("strong"); b.textContent = c.company || "Untitled"; name.appendChild(b);
      if (c.title) { var tt = document.createElement("span"); tt.className = "pipe-result-title"; tt.textContent = " · " + c.title; name.appendChild(tt); }
      var ln = document.createElement("span"); ln.className = "pipe-result-list"; ln.textContent = listName;
      row.appendChild(name); row.appendChild(ln);
      row.addEventListener("click", function () { resultsEl.hidden = true; searchInput.blur(); openCard(c.id); });
      resultsEl.appendChild(row);
    });
    resultsEl.hidden = false;
  }

  searchInput.addEventListener("input", renderSearch);
  searchInput.addEventListener("focus", function () { if (searchInput.value.trim()) renderSearch(); });
  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { searchInput.value = ""; resultsEl.hidden = true; searchInput.blur(); }
    else if (e.key === "Enter") { var first = resultsEl.querySelector(".pipe-result"); if (first) first.click(); }
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".pipe-searchwrap")) resultsEl.hidden = true;
  });

  // ---- init: restore last tab ----
  var startTab = "brief";
  try { startTab = localStorage.getItem("triage_tab") || "brief"; } catch (e) {}
  showView(startTab);
})();
</script>
